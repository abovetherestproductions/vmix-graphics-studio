<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Final Rankings</title>

  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/graphics/rankings/style.css" />
</head>
<body>
  <div id="stage" class="stage">
    <div id="graphic-root" class="rankings hidden">
      <div id="panel" class="rk-panel">

        <!-- Header stays frozen during page transitions -->
        <div class="rk-header">
          <div class="rk-header-ring"></div>
          <div class="header-logo-wrap rk-logo-wrap" style="display:none">
            <img class="header-logo rk-logo" src="" alt="" />
          </div>
          <div class="rk-header-left">
            <div id="rk-title" class="rk-title">Final Rankings</div>
            <div id="rk-subtitle" class="rk-subtitle"></div>
            <div class="header-event-info rk-event-info"></div>
          </div>
        </div>

        <!-- Only this rows container animates on page changes -->
        <div id="rk-rows" class="rk-rows"></div>

      </div>
    </div>
  </div>

  <script src="/js/core/config.js"></script>
  <script src="/js/core/caps-targets.js"></script>
  <script src="/js/core/theme-loader.js"></script>
  <script src="/js/core/utils.js"></script>
  <script src="/js/core/json-poller.js"></script>
  <script src="/js/core/ws-listener.js"></script>
  <script src="/js/core/state-machine.js"></script>
  <script src="/js/graphics/rankings.js"></script>
</body>
</html>
