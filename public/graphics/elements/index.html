<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Elements Tracker</title>

  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/graphics/elements/style.css" />
</head>
<body>
  <div id="stage" class="stage">
    <div id="graphic-root" class="elements hidden">

      <!-- Header: skater name + running total -->
      <div class="el-header">
        <div class="header-logo-wrap el-logo-wrap" style="display:none">
          <img class="header-logo el-logo" src="" alt="" />
        </div>
        <div id="el-skater" class="el-skater">Skater Name</div>
        <div class="el-total-block">
          <div id="el-total-label" class="el-total-label">TES</div>
          <div id="el-total" class="el-total">0.00</div>
        </div>
      </div>

      <!-- Body (rows + light rail) — wrapped so it can slide down from
           behind the header as a single unit on entry, with a delay. -->
      <div id="el-body" class="el-body">
        <div id="el-rows" class="el-rows"></div>
        <div id="el-light-rail" class="el-light-rail" aria-label="GOE light rail"></div>
      </div>

    </div>
  </div>

  <script src="/js/core/config.js"></script>
  <script src="/js/core/caps-targets.js"></script>
  <script src="/js/core/theme-loader.js"></script>
  <script src="/js/core/utils.js"></script>
  <script src="/js/core/json-poller.js"></script>
  <script src="/js/core/ws-listener.js"></script>
  <script src="/js/core/state-machine.js"></script>
  <script src="/js/graphics/elements.js"></script>
</body>
</html>
