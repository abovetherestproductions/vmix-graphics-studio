<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Skater Profile</title>

  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/graphics/skater-profile/style.css" />
</head>
<body>
  <div id="stage" class="stage">
    <div id="graphic-root" class="skater-profile hidden">

      <!-- The card. Portraits sit in the name row, not beside it. -->
      <div class="sp-info-panel">

        <div class="sp-header">
          <div class="header-logo-wrap sp-logo-wrap" style="display:none">
            <img class="header-logo sp-logo" src="" alt="" />
          </div>
          <div class="sp-header-ring"></div>
          <div class="sp-header-text">
            <div id="sp-event" class="sp-event">Event Title</div>
            <div id="sp-subtitle" class="sp-subtitle"></div>
          </div>
        </div>

        <div class="sp-body">
          <div id="sp-name-row" class="sp-name-row">
            <!-- Profile-sized portraits, one per skater. A team stacks two,
                 each level with its own name. A portrait that is missing or
                 will not load becomes an initials tile rather than a broken
                 image or a gap, so the rows stay lined up. -->
            <div id="sp-photo-wrap" class="sp-photos" hidden>
              <div id="sp-photo-slot-1" class="sp-photo-slot">
                <img id="sp-photo" class="sp-photo" src="" alt="" />
                <div id="sp-initials-1" class="sp-initials"></div>
              </div>
              <div id="sp-photo-slot-2" class="sp-photo-slot" hidden>
                <img id="sp-photo-2" class="sp-photo" src="" alt="" />
                <div id="sp-initials-2" class="sp-initials"></div>
              </div>
            </div>
            <div class="sp-ident">
              <div class="sp-ident-top">
                <img id="sp-flag" class="sp-flag" src="" alt="" style="display:none" />
                <div id="sp-name" class="sp-name">Skater Name</div>
              </div>
              <div id="sp-club" class="sp-club">Club Name</div>
            </div>
          </div>

          <div class="sp-divider"></div>

          <div class="sp-stats">
            <div class="sp-stat" id="stat-sb">
              <div class="sp-stat-label">SEASON BEST</div>
              <div id="sp-sb" class="sp-stat-value">—</div>
            </div>
            <div class="sp-stat" id="stat-pb">
              <div class="sp-stat-label">PERSONAL BEST</div>
              <div id="sp-pb" class="sp-stat-value">—</div>
              <div id="sp-pb-event" class="sp-stat-sub" hidden></div>
            </div>
          </div>

          <!-- Separates the two headline numbers from the biographical
               detail below them. -->
          <div class="sp-divider sp-divider-tight"></div>

          <!-- Optional detail rows. Each is switched on per-graphic by the
               operator and hidden when it has nothing to say, so the panel
               never shows an empty label. -->
          <div id="sp-details" class="sp-details" hidden>
            <div class="sp-detail" data-field="age" hidden>
              <div class="sp-detail-label">AGE</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="hometown" hidden>
              <div class="sp-detail-label">HOMETOWN</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="birthplace" hidden>
              <div class="sp-detail-label">BIRTHPLACE</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="skaterClub" hidden>
              <div class="sp-detail-label">CLUB</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="trainsIn" hidden>
              <div class="sp-detail-label">TRAINS IN</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="coach" hidden>
              <div class="sp-detail-label">COACH</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="formerCoach" hidden>
              <div class="sp-detail-label">FORMER COACH</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="choreographer" hidden>
              <div class="sp-detail-label">CHOREOGRAPHER</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="height" hidden>
              <div class="sp-detail-label">HEIGHT</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="startedSkating" hidden>
              <div class="sp-detail-label">STARTED SKATING</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="profession" hidden>
              <div class="sp-detail-label">PROFESSION</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="hobbies" hidden>
              <div class="sp-detail-label">HOBBIES</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="shortMusic" hidden>
              <div class="sp-detail-label">SHORT PROGRAM</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="freeMusic" hidden>
              <div class="sp-detail-label">FREE PROGRAM</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="worldsRank" hidden>
              <div class="sp-detail-label">WORLD RANKING</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="nationalsRank" hidden>
              <div class="sp-detail-label">NATIONAL RANKING</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="fourCCRank" hidden>
              <div class="sp-detail-label">FOUR CONTINENTS</div>
              <div class="sp-detail-value"></div>
            </div>
            <div class="sp-detail" data-field="olympicsRank" hidden>
              <div class="sp-detail-label">OLYMPIC GAMES</div>
              <div class="sp-detail-value"></div>
            </div>

          <div id="sp-bio" class="sp-bio" hidden></div>
        </div>

      </div>
    </div>
  </div>

  <script src="/js/core/config.js"></script>
  <script src="/js/core/caps-targets.js"></script>
  <script src="/js/core/theme-loader.js"></script>
  <script src="/js/core/utils.js"></script>
  <script src="/js/core/json-poller.js"></script>
  <script src="/js/core/ws-listener.js"></script>
  <script src="/js/core/state-machine.js"></script>
  <script src="/js/graphics/skater-profile.js"></script>
</body>
</html>
